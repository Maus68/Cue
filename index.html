urylid 2", "text": "Drie uur later?"}, {"role": "Jurylid 3", "text": "Ja, drie uur later."}, {"role": "Jurylid 11", "text": "Als ik die jongen was en ik had mijn vader vermoord, zou ik niet drie uur later naar huis zijn gekomen. Ik zou bang zijn dat de politie er zou zijn. Ik zou wegblijven, met of zonder mes."}, {"role": "Jurylid 3", "text": "Luister, je hebt voor 'schuldig' gestemd, toch? Aan welke kant sta je?"}, {"role": "Jurylid 11", "text": "Ik vind niet dat ik loyaal moet zijn aan de ene of de andere kant. Ik stel gewoon vragen."}, {"role": "Jurylid 12", "text": "Nou, dit is gewoon een hersenspinsel, maar als ik die jongen was geweest, en ik had, je weet wel, gestoken en zo, dan zou ik het risico nemen en teruggaan om het mes te halen. Ik wed dat hij dacht dat niemand hem had gezien en dat het lichaam waarschijnlijk nog niet eens was ontdekt. Het was tenslotte midden in de nacht. Hij dacht waarschijnlijk dat niemand de jongen zou vinden tot de volgende dag."}, {"role": "Jurylid 11", "text": "Sorry, maar ik denk er zo over. De vrouw aan de overkant van de straat verklaarde dat ze, even nadat ze de moord had gezien, dat wil zeggen even nadat de trein voorbij was gereden, had geschreeuwd en vervolgens de politie had gebeld. De jongen moet die schreeuw zeker gehoord hebben en geweten hebben dat iemand iets gezien had. Ik denk niet dat hij teruggegaan zou zijn als hij de moordenaar was geweest."}, {"role": "Jurylid 4", "text": "Twee punten. Ten eerste: in zijn paniek heeft hij de schreeuw misschien niet gehoord. Misschien was die niet erg luid. Ten tweede: als hij die wel heeft gehoord, heeft hij die misschien niet in verband gebracht met zijn eigen daad. Vergeet niet dat hij in een buurt woonde waar geschreeuw vrij normaal was."}, {"role": "Jurylid 3", "text": "Juist! Dat bedoel ik."}, {"role": "Jurylid 8", "text": "Misschien. Misschien heeft hij zijn vader wel gestoken, heeft hij de schreeuw van de vrouw niet gehoord, is hij in paniek weggerend, is hij drie uur later gekalmeerd en teruggekomen om het mes te pakken, met het risico om door de politie opgepakt te worden. Misschien is dat allemaal wel zo. Maar misschien ook niet. Ik denk dat er genoeg twijfel is om ons te doen afvragen of hij überhaupt wel aanwezig was op het moment dat de moord plaatsvond."}, {"role": "Jurylid 10", "text": "Wat bedoel je met twijfel? Waar heb je het over? Heeft de oude man hem niet uit het huis zien rennen? Hij verdraait de feiten. Ik zeg het je! (tegen de 11e jurylid) Heeft de oude man het kind om tien over twaalf het huis uit zien rennen of niet? Nou, heeft hij dat gedaan of niet?"}, {"role": "Jurylid 11", "text": "Hij zegt van wel."}, {"role": "Jurylid 10", "text": "Hij zegt van wel? (tegen de anderen) Tjongejonge! Serieus! (tegen de 11e jurylid) Nou, heeft de vrouw aan de overkant van de straat gezien dat het kind zijn vader heeft vermoord, of niet? Ze zegt van wel. Je doet alsof het niet uitmaakt wat mensen zeggen. Wat je wilt geloven, geloof je, en wat je niet wilt geloven, geloof je niet. Wat is dat voor houding? Waarom denk je dat deze mensen in de getuigenbank plaatsnemen, voor hun lol? Ik zeg jullie, dames en heren, de feiten worden hier verdraaid. Getuigen worden in twijfel getrokken en daar is geen reden voor."}, {"role": "Jurylid 5", "text": "Getuigen kunnen fouten maken."}, {"role": "Jurylid 10", "text": "Natuurlijk, als je dat wilt, maken ze fouten! Begrijp je wat ik bedoel?"}, {"role": "Voorzitter", "text": "Oké. Laten we niet zo hard schreeuwen."}, {"role": "Jurylid 10", "text": "Dat blijf je maar zeggen. Misschien hebben we hier juist een beetje geschreeuw nodig. Deze jongens gaan alle kanten op. Ze hoorden de schreeuw wel, ze hoorden de schreeuw niet. Wat maakt het uit? Het zijn maar kleine details. Je vergeet de belangrijke dingen. Ik bedoel, ineens is iedereen hier..."}, {"role": "Jurylid 8", "text": "Ik wil graag nog een stemming aanvragen."}, {"role": "Jurylid 10", "text": "Luister, ik ben aan het woord."}, {"role": "Voorzitter", "text": "Er is om een nieuwe stemming gevraagd. Ga nu zitten. (Juryleden die staan, gaan naar hun stoelen.)"}, {"role": "Jurylid 3", "text": "Wat heeft dat nu voor zin?"}, {"role": "Voorzitter", "text": "Ik weet het niet. Deze beste man vroeg..."}, {"role": "Jurylid 3", "text": "Ik heb nog nooit gezien dat er zoveel tijd werd besteed aan niets."}, {"role": "Jurylid 2", "text": "(mild) Het duurt maar een seconde."}, {"role": "Voorzitter", "text": "Oké. Ik denk dat de snelste manier is om uit te zoeken wie voor 'niet schuldig' stemt. Iedereen die voor 'niet schuldig' stemt, steekt zijn hand op. (De 5e, 8e en"}, {"role": "Jurylid 9", "text": "steken hun hand op). Nog steeds hetzelfde. Eén, twee, drie niet schuldig. Negen schuldig."}, {"role": "Jurylid 7", "text": "Waar staan we nu? We kunnen hier tot volgende week dinsdag blijven kletsen, maar wat levert ons dat op?"}, {"role": "Jurylid 11", "text": "Pardon. (hij steekt langzaam zijn hand op) Ik stem voor niet schuldig."}, {"role": "Jurylid 7", "text": "Oh, man!"}, {"role": "Jurylid 3", "text": "Oh, luister eens! Waar heb je het over? Ik bedoel, we worden hier allemaal gek of zo! Deze jongen is schuldig. Waarom let je niet op de feiten? (tegen 4e jurylid) Dit begint verdomd irritant te worden"}, {"role": "Voorzitter", "text": "De stemming is acht tegen vier, ten gunste van schuldig."}, {"role": "Jurylid 3", "text": "Ik bedoel, iedereen begint medelijden te krijgen met dat kleine rotjoch, alsof de president net heeft uitgeroepen dat het \"Week van de liefde voor het kansarme kind\" is, of zoiets. (tegen 11e jurylid) Luister, ik wil graag dat je me vertelt waarom je je stem hebt gewijzigd. Kom op, geef me redenen."}, {"role": "Jurylid 11", "text": "Ik hoef mijn beslissing niet aan u te verdedigen. Ik heb redelijke twijfel."}, {"role": "Jurylid 3", "text": "Welke redelijke twijfel? Dat zijn slechts woorden. (Hij haalt het zakmes uit de tafel en houdt het omhoog.) Hier, kijk eens. De jongen die u zojuist onschuldig hebt verklaard, is gezien terwijl hij dit ding in zijn vader stak. Kijk er maar eens naar, meneer Redelijke Twijfel."}, {"role": "Jurylid 9", "text": "Dat is niet het gebruikte mes. Weet u dat niet meer?"}, {"role": "Jurylid 3", "text": "Ach Rot op! (Hij steekt het mes in de tafel.) Akte 4 Beslissende doorbraken"}]}, {"title": "SCENE 9       Reconstructie Loop", "cards": [{"role": "Jurylid 7", "text": "Dit is echt te gek. (tegen de 8e jurylid) Ik bedoel, je zit hier maar wat verhalen uit je duim te zuigen. Wat moeten we nu geloven? (tegen de anderen) Ik zeg je, als deze man aan de ring had gezeten tijdens het gevecht tussen Mohammed Ali en Frazier, zou hij ons proberen wijs te maken dat Mohammed Ali gewonnen had. (tegen de 8e jurylid) Luister, hoe zit het met die oude man? Moeten we geloven dat hij niet opstond en naar zijn deur rende om te zien hoe de jongen vijftien seconden na de moord de trap af rende? Hij zegt alleen dat hij het gedaan heeft om belangrijk te zijn. Ik bedoel, wat is het nut van dit alles...?"}, {"role": "Jurylid 5", "text": "Wacht even. Zei de oude man dat hij naar de deur rende?"}, {"role": "Jurylid 7", "text": "Gerend. Gelopen. Wat maakt het uit? Hij kwam er."}, {"role": "Jurylid 6", "text": "Hij zei dat hij naar de deur rende. Tenminste, dat denk ik."}, {"role": "Jurylid 5", "text": "Ik weet niet meer wat hij zei. Maar ik zie niet in hoe hij zou kunnen rennen."}, {"role": "Jurylid 4", "text": "Hij zei dat hij van zijn slaapkamer naar de voordeur ging. Dat is toch genoeg?"}, {"role": "Jurylid 8", "text": "Wacht even. Waar was zijn slaapkamer ook alweer?"}, {"role": "Jurylid 10", "text": "Ergens in de gang. Ik dacht dat jij je alles herinnerde. Weet je dat niet meer?"}, {"role": "Jurylid 8", "text": "Nee. Voorzitter, ik wil graag de plattegrond van het appartement bekijken."}, {"role": "Jurylid 7", "text": "Waarom laten we ze de rechtszaak niet opnieuw voeren, zodat je alles op een rijtje kunt zetten?"}, {"role": "Jurylid 8", "text": "Meneer de voorzitter..."}, {"role": "Voorzitter", "text": "Ik heb u gehoord. (Hij gaat naar de deur en klopt. De bewaker komt binnen. De voorzitter overlegt kort met hem. De bewaker gaat weg en sluit de deur achter zich.)"}, {"role": "Jurylid 3", "text": "Oké, waar is dit voor? Hoe komt het dat jij de enige in de kamer bent die altijd bewijsstukken wil zien?"}, {"role": "Jurylid 5", "text": "Ik wil die van hem ook zien."}, {"role": "Jurylid 3", "text": "En ik wil geen tijd meer verspillen."}, {"role": "Jurylid 4", "text": "Als we gaan beginnen met al dat gedoe over waar het lichaam is gevonden..."}, {"role": "Jurylid 8", "text": "Dat doen we niet. Tenzij iemand anders dat wil. Ik wil graag zien of een zeer oude man die met één been sleept omdat hij vorig jaar een beroerte heeft gehad, in vijftien seconden van zijn bed naar zijn voordeur kan lopen."}, {"role": "Jurylid 3", "text": "Hij zei twintig seconden."}, {"role": "Jurylid 8", "text": "Hij zei vijftien."}, {"role": "Jurylid 3", "text": "Ik zeg je dat hij twintig zei. Wat probeer je te verdraaien..."}, {"role": "Jurylid 12", "text": "Hij zei vijftien."}, {"role": "Jurylid 3", "text": "Hoe weet hij hoe lang vijftien seconden is? Dat kun je niet beoordelen."}, {"role": "Jurylid 9", "text": "Hij zei vijftien seconden. Hij was daar heel stellig over."}, {"role": "Jurylid 3", "text": "Hij is een oude man. Je hebt hem gezien. De helft van de tijd was hij in de war. Hoe kan hij ergens zeker van zijn? (De bewaker komt binnen met een groot diagram van het appartement. Het diagram is een plattegrond van een spoorwegflat. Een slaapkamer kijkt uit op de spoorlijn. Daarachter ligt een reeks kamers aan een lange gang. In de voorkamer staat een \"X\" die de plek aangeeft waar het lichaam is gevonden. Aan de achterkant van het appartement zien we de ingang van de hal van het appartement vanuit de hal van het gebouw. We zien een trap in de hal van het gebouw. Elke kamer is gelabeld en de afmetingen van elke kamer worden weergegeven. De voorzitter neemt de plattegrond mee. De bewaker vertrekt.)"}, {"role": "Jurylid 4", "text": "Ik zie niet in wat we hier willen bewijzen. De man zei dat hij de jongen naar buiten zag rennen."}, {"role": "Jurylid 8", "text": "Laten we eens kijken of de details zijn verhaal bevestigen. Zodra het lichaam op de grond viel, zei hij, hoorde hij voetstappen boven die naar de voordeur renden. Hij hoorde de deur boven opengaan en de voetstappen de trap afkomen. Hij rende zo snel hij kon naar zijn voordeur. Hij zwoer dat het niet langer dan vijftien seconden had geduurd. Als de moordenaar meteen begon te rennen…"}, {"role": "Jurylid 12", "text": "Misschien deed hij dat niet."}, {"role": "Jurylid 8", "text": "De oude man zei dat hij dat deed."}, {"role": "Jurylid 7", "text": "Weet je, je zou in Atlantic City moeten zijn op de conventie van mierenneukers."}, {"role": "Jurylid 6", "text": "Luister eens, meneertje honkbal, waarom houd je niet eens op met die lullige opmerkingen?"}, {"role": "Jurylid 7", "text": "Mijn vriend, voor die paar dollar per dag moet je naar alles luisteren."}, {"role": "Jurylid 10", "text": "(tegen 8e jurylid) Nou, nu je dat ding hier hebt, hoe zit het daarmee?"}, {"role": "Jurylid 8", "text": "(tegen de voorzitter) Mag ik? (Hij pakt het plan en legt het op een stoel.) Dit is het appartement waar de moord plaatsvond. Het appartement van de oude man ligt er direct onder en is precies hetzelfde. Hier zijn de tramrails. De slaapkamer. Nog een slaapkamer. Badkamer. Woonkamer. Keuken. En dit is de hal. Hier is de voordeur van het appartement. En hier zijn de trappen. De oude man lag in bed in deze kamer. (Hij wijst naar de slaapkamer aan de voorkant.) Hij zegt dat hij opstond, de gang in liep, door de gang naar de voordeur deur, die opende en net op tijd naar buiten keek om de jongen de trap af te zien rennen. Klopt het tot nu toe?"}, {"role": "Jurylid 3", "text": "Dat is het verhaal, voor de negentiende keer"}, {"role": "Jurylid 8", "text": "Vijftien seconden nadat hij het lichaam hoorde vallen."}, {"role": "Jurylid 11", "text": "Correct."}, {"role": "Jurylid 8", "text": "Zijn bed stond bij het raam. Het is... (hij kijkt aandachtig naar de plattegrond) vier meter van zijn bed tot de slaapkamerdeur. De lengte van de gang is elf meter. Nu moest hij uit bed komen, 4 meter lopen, de slaapkamerdeur openen, 11 meter lopen en de voordeur openen, en dat alles in vijftien seconden. Denk je dat hij dat had kunnen doen?"}, {"role": "Jurylid 10", "text": "Natuurlijk had hij dat gekund."}, {"role": "Jurylid 11", "text": "Hij kan alleen heel langzaam lopen. Ze moesten hem helpen om in de getuigenstoel te gaan zitten."}, {"role": "Jurylid 3", "text": "Je doet alsof het een lange wandeling is. Dat is het niet."}, {"role": "Jurylid 9", "text": "Voor een oude man die een beroerte heeft gehad, is het een lange wandeling. (De 8e jurylid verplaatst zijn stoel en zet de stoel neer om een bed aan te duiden.)"}, {"role": "Jurylid 10", "text": "Wat doe je?"}, {"role": "Jurylid 8", "text": "Ik wil dit eens proberen. Eens kijken hoe lang hij erover deed."}, {"role": "Jurylid 3", "text": "Wat bedoel je met dat je het wilt proberen? Waarom heeft de advocaat van het kind het niet ter sprake gebracht als het zo belangrijk is?"}, {"role": "Jurylid 5", "text": "Misschien heeft hij er gewoon niet aan gedacht."}, {"role": "Jurylid 10", "text": "Hoezo, daar heeft hij niet aan gedacht? Denk je soms dat die man een idioot is of zo? Het is toch overduidelijk."}, {"role": "Jurylid 5", "text": "Heb jij eraan gedacht?"}, {"role": "Jurylid 10", "text": "Luister eens, slimmerik. Het maakt niet uit of ik eraan gedacht heb."}, {"role": "Voorzitter", "text": "Oké, laten we nu even rustig blijven."}, {"role": "Jurylid 10", "text": "De advocaat bracht het niet ter sprake omdat hij wist dat het antwoord zijn zaak zou schaden. Wat vind je daarvan?"}, {"role": "Voorzitter", "text": "Oké..."}, {"role": "Jurylid 8", "text": "Het is mogelijk dat hij het niet ter sprake heeft gebracht, omdat het zou betekenen dat hij een hulpeloze oude man zou moeten lastigvallen en intimideren, iets wat volgens mij niet erg goed valt bij een jury en de rechtbank. De meeste advocaten vermijden dat soort dingen als ze kunnen."}, {"role": "Jurylid 7", "text": "Is hij dan zo’n prutser?"}, {"role": "Jurylid 8", "text": "Dat is wat ik me afvraag. Oké. Laten we zeggen dat deze stoelen het bed van de oude man zijn. Ik ga 4 meter afmeten, de lengte van de slaapkamer. (Hij loopt meter)"}, {"role": "Jurylid 3", "text": "Je bent gek. Zoiets kun je niet namaken."}, {"role": "Jurylid 11", "text": "Ik zou het wel eens willen zien."}, {"role": "Jurylid 8", "text": "Geef me eens een stoel (De 12e jurylid pakt zijn stoel op en brengt deze naar de 8e jurylid. De 8e jurylid zet de stoel neer waar hij staat.) Oké, dit is de slaapkamerdeur. De gang is iets meer dan twaalf meter lang. Ik loop dit stuk heen en weer. (Hij loopt heen en weer en telt stil zijn stappen.)"}, {"role": "Jurylid 10", "text": "Luister, dit is volkomen idioot. Waarom verspillen we hier ieders tijd?"}, {"role": "Jurylid 8", "text": "twaalf... (hij stopt en wendt zich tot de 10e jurylid) Volgens jou duurt het maar vijftien seconden. Dat kunnen we wel missen... (Hij gaat weer heen en weer lopen, telt in zichzelf en bereikt de muur. De anderen kijken zwijgend toe. Hij draait zich om en loopt heen en weer, terwijl hij de rest van de afstand aflegt.) Negenendertig, veertig, eenenveertig, tweeënveertig, drieënveertig. Oké, geef me nog een stoel, alsjeblieft. (De 6e jurylid pakt een stoel en brengt die naar de 8e jurylid. De 8e jurylid zet hem neer waar hij staat.) Dit is de deur naar de buitenhal en het trappenhuis. Volgens de getuigenverklaring was deze met een ketting afgesloten. Wie heeft er een horloge met een secondewijzer?"}, {"role": "Jurylid 2", "text": "Ik."}, {"role": "Jurylid 8", "text": "Als je wilt dat ik begin, stamp dan met je voet. Dat is het moment waarop het lichaam valt. Meet vanaf dat moment de tijd. (Hij gaat op de twee stoelen liggen.)"}, {"role": "Jurylid 7", "text": "(Sarcastisch) Iemand zin in een potje hints?"}, {"role": "Jurylid 3", "text": "Ik heb nog nooit zoiets gezien in mijn hele leven!"}, {"role": "Jurylid 8", "text": "Oké.Ik ben er klaar voor. (De 2e jurylid staart naar zijn horloge en wacht.)"}, {"role": "Jurylid 10", "text": "Kom op, laten we beginnen."}, {"role": "Jurylid 2", "text": "Ik wil wachten tot de secondewijzer bovenaan staat. (Ze wachten. De 2e jurylid stampt plotseling met zijn voet. De 8e jurylid gaat rechtop zitten, zwaait zijn benen op de grond en staat op. De 2e jurylid houdt zijn ogen op zijn horloge gericht. De 8e jurylid strompelt, terwijl hij één been sleept, naar de stoel die dienst doet als slaapkamerdeur. Hij bereikt deze en doet alsof hij de deur opent. Vervolgens strompelt hij door de gesimuleerde gang van dertien meter.)"}, {"role": "Jurylid 10", "text": "Kom op. Haast je. Hij liep twee keer zo snel."}, {"role": "Jurylid 11", "text": "Dit is, denk ik, zelfs nog sneller dan de oude man in de rechtszaal liep."}, {"role": "Jurylid 8", "text": "(nog steeds strompelend) Als u vindt dat ik sneller moet lopen, dan doe ik dat. (Hij versnelt zijn pas iets, bereikt de muur, draait zich om en loopt naar de tweede stoel, die de deur naar de buitenste gang simuleert.)"}, {"role": "Jurylid 3", "text": "Kom op, zeg! Laten we deze onzin maar snel afmaken. (Ze kijken toe terwijl de"}, {"role": "Jurylid 8", "text": "de laatste stoel bereikt. Hij doet alsof hij een denkbeeldig kettingslot opent en opent vervolgens de denkbeeldige deur.)"}, {"role": "Jurylid 8", "text": "Stop!"}, {"role": "Jurylid 2", "text": "Gestopt!"}, {"role": "Jurylid 8", "text": "Hoe lang duurde het?"}, {"role": "Jurylid 2", "text": "Tweeënveertig seconden precies."}, {"role": "Jurylid 6", "text": "Tweeënveertig seconden!"}, {"role": "Jurylid 8", "text": "Ik denk dat dit is wat er gebeurd is. De oude man hoorde een paar uur eerder het ruzie tussen de jongen en zijn vader. Toen hij in bed lag, hoorde hij een lichaam op de vloer van het appartement van de jongen vallen en hoorde hij de vrouw aan de overkant van de straat schreeuwen. Hij stond op, probeerde naar de deur te gaan, hoorde iemand de trap af rennen en nam aan dat het de jongen was."}, {"role": "Jurylid 6", "text": "Dat klinkt aannemelijk."}, {"role": "Jurylid 3", "text": "Hou op! Luister eens naar me, mensen. Ik heb in mijn leven al heel wat oneerlijkheid gezien, maar dit gaat echt te ver. Je komt hier binnen met je schijnheilige gepraat over kinderen in sloppenwijken en onrechtvaardigheid, je verzint wilde verhalen en ineens weet je een aantal van deze mensen hier te overtuigen. Nou, mij overtuig je niet. Ik heb er genoeg van. Wat is er met jullie aan de hand? Jullie weten allemaal dat deze jongen schuldig is. Hij moet branden. We laten hem hier door onze vingers glippen."}, {"role": "Jurylid 8", "text": "Door de vingers glippen? Wil jij misschien de executie uitvoeren?"}, {"role": "Jurylid 3", "text": "Voor deze jongen? Ik zou graag de schakelaar over te halen."}, {"role": "Jurylid 8", "text": "Het spijt me voor je."}, {"role": "Jurylid 3", "text": "Begin nu niet met mij."}, {"role": "Jurylid 8", "text": "Sinds we deze kamer binnenkwamen, gedraag je je als een zelfbenoemde publieke wreker."}, {"role": "Jurylid 3", "text": "Ik zeg je, hou je mond!"}, {"role": "Jurylid 8", "text": "Je wilt deze jongen zien sterven omdat je dat persoonlijk wilt, niet vanwege de feiten."}, {"role": "Jurylid 3", "text": "Hou je mond!"}, {"role": "Jurylid 8", "text": "Je bent een sadist!"}, {"role": "Jurylid 3", "text": "Hou je kop, klootzak! (Hij springt wild op de 8e jurylid af. Het 8e jurylid houdt voet bij stuk. Het 5e en 6e jurylid grijpen de 3e jurylid van achteren vast. Hij verzet zich tegen de handen, zijn gezicht donker van woede.) Laat me los, verdomme! Ik vermoord hem! Ik vermoord hem!"}, {"role": "Jurylid 8", "text": "(kalm) Je meent toch niet echt dat je me gaat vermoorden? (Het 3e jurylid breekt met de 2e en 6e jurylid, stopt met worstelen en staart de 8e jurylid bitter aan. Er valt een stilte. Het derde jurylid loopt naar het raam. De andere juryleden lopen door de kamer. Er valt een ongemakkelijke stilte. De bewaker komt binnen.)"}]}, {"title": "SCENE 10 Verdeelde jury", "cards": [{"role": "Bewaker", "text": "Is er iets aan de hand, heren? Ik hoorde wat lawaai."}, {"role": "Voorzitter", "text": "Nee, er is niets aan de hand. (hij pakt de plattegrond van het appartement van de tafel) Gewoon een kleine discussie. Alles is in orde. (Hij geeft de plattegrond aan de bewaker) Deze kan terug, we zijn hiermee klaar. (De bewaker neemt het plan aan, kijkt zorgvuldig rond in de kamer en verlaat vervolgens de ruimte. Er valt een stilte. De anderen kijken naar de derde jurylid.)"}, {"role": "Jurylid 3", "text": "Nou, waar kijken jullie nou? (De anderen kijken beschaamd weg. Sommigen gaan zitten.)"}, {"role": "Jurylid 12", "text": "Nou, ik denk dat iemand weer moet beginnen."}, {"role": "Jurylid 2", "text": "Het wordt al laat. (tegen de voorzitter) Ik vraag me af of ze ons naar huis laten gaan als we het vanavond niet afkrijgen. Mijn zoontje is ziek."}, {"role": "Jurylid 11", "text": "Pardon. Dit gekibbel. Dit is niet waarom we hier zijn, om te kibbelen. We hebben een verantwoordelijkheid. Dit is, heb ik altijd gevonden, iets opmerkelijks aan democratie. Dat we, eh, hoe zeg je dat? Op de hoogte worden gesteld. Dat we per post worden opgeroepen om naar deze plek te komen en te beslissen over de schuld of onschuld van een man die we nooit hebben gezien. We hebben niets te winnen of te verliezen met ons oordeel. Dat is een van de redenen waarom we sterk zijn. We moeten er geen persoonlijke kwestie van maken."}, {"role": "Jurylid 2", "text": "(Staat op en loopt naar het raam) Kijk eens hoe donker het wordt. Er komt een storm aan."}, {"role": "Jurylid 6", "text": "Eh, luister, ik vroeg me af of we misschien nog een keer moeten stemmen."}, {"role": "Jurylid 7", "text": "Geweldig idee. Misschien kunnen we dit vervolgen met dansen en een hapje en een drankje."}, {"role": "Jurylid 6", "text": "Meneer de voorzitter?"}, {"role": "Voorzitter", "text": "Ik vind het prima. Is er iemand die niet wil stemmen?"}, {"role": "Jurylid 3", "text": "Dan dit keer wel een open stemming. Zeg hardop wat je stem is, dat is wel zo transparant. Laten we eens kijken wie waar staat."}, {"role": "Voorzitter", "text": "Dat klinkt redelijk. Heeft iemand bezwaar? De laatste stemming was acht tegen vier voor schuldig. Oké. Ik roep jullie jurynummers op. Ik stem voor schuldig. Jurylid Twee?"}, {"role": "Jurylid 2", "text": "Niet schuldig"}, {"role": "Voorzitter", "text": "drie"}, {"role": "Jurylid 3", "text": "Schuldig"}, {"role": "Voorzitter", "text": "Vier"}, {"role": "Jurylid 4", "text": "Schuldig"}, {"role": "Voorzitter", "text": "Vijf 5ejurylid Niet schuldig"}, {"role": "Voorzitter", "text": "Zes"}, {"role": "Jurylid 6", "text": "Niet schuldig"}, {"role": "Voorzitter", "text": "Zeven"}, {"role": "Jurylid 7", "text": "Schuldig"}, {"role": "Voorzitter", "text": "Acht"}, {"role": "Jurylid 8", "text": "Niet schuldig"}, {"role": "Voorzitter", "text": "Negen"}, {"role": "Jurylid 9", "text": "Niet schuldig"}, {"role": "Voorzitter", "text": "Tien"}, {"role": "Jurylid 10", "text": "Schuldig"}, {"role": "Voorzitter", "text": "Elf"}, {"role": "Jurylid 11", "text": "Niet schuldig"}, {"role": "Voorzitter", "text": "Twaalf"}, {"role": "Jurylid 12", "text": "Schuldig"}, {"role": "Voorzitter", "text": "Zes tegen zes!"}, {"role": "Jurylid 7", "text": "En we gaan hier naar extra innings."}, {"role": "Jurylid 10", "text": "Zes tegen zes! Ik zeg jullie, sommigen van jullie hier zijn gek geworden. Zo'n jongen?"}, {"role": "Jurylid 9", "text": "Ik denk niet dat het soort jongen dat hij is iets met de zaak te maken heeft. De feiten moeten de zaak bepalen."}, {"role": "Jurylid 10", "text": "Ach, kom daar maar niet mee aan. Ik ben de feiten helemaal zat. Je kunt ze verdraaien zoals je wilt, snap je?"}, {"role": "Jurylid 9", "text": "Dat is precies het punt dat deze heer... (hij wijst naar de 8e jurylid) heeft gezegd. Ik bedoel, je blijft maar uit volle borst schreeuwen... (De 8e jurylid legt zijn hand op de schouder van de 9e jurylid. De 9e jurylid kijkt hem aan en gaat zitten.) Ik zou graag wat jonger willen zijn. Die man... (hij stopt, niet in staat om verder te gaan) Het is erg warm hierbinnen."}, {"role": "Jurylid 11", "text": "Wil je wat water?"}, {"role": "Jurylid 9", "text": "Nee, bedankt."}, {"role": "Jurylid 2", "text": "Het gaat regenen."}, {"role": "Jurylid 7", "text": "Nee, dat jij dat weet, weerman! Vertel eens, hoe komt het dat je bent overgestapt?"}, {"role": "Jurylid 2", "text": "Nou, het leek me gewoon..."}, {"role": "Jurylid 7", "text": "Ik bedoel, je hebt geen poot om op te staan. Dat weet je toch wel, hè?"}, {"role": "Jurylid 2", "text": "Nou, dat vind ik niet. Er zijn veel details die nooit naar buiten zijn gekomen."}, {"role": "Jurylid 10", "text": "Details! Je laat je gewoon mee sleuren door een stel, hoe zeg je dat ook alweer, intellectuelen."}, {"role": "Jurylid 2", "text": "Dat is niet waar."}, {"role": "Jurylid 10", "text": "Ach, kom op. Je bent net als iedereen. Je denkt te veel na, je raakt in de war. Begrijp je wat ik bedoel?"}, {"role": "Jurylid 2", "text": "Luister, ik vind dat je geen recht hebt om... (De tiende jurylid loopt weg. Zachtjes) Eikel…… (We horen alleen het geluid van de regen die in de stilte neerdaalt. Hoofden draaien zich naar het raam. De regen valt met bakken uit de lucht. De vierde jurylid en de 10e jurylid gaan naar het toilet. Anderen blijven zitten 8e jurylid loopt naar het raam)"}, {"role": "Voorzitter", "text": "Laten we kort pauzeren (De voorzitter loopt naar de achtste jurylid) Kijk eens hoe hard het regent. Denk je dat het nu wat afkoelt?"}, {"role": "Jurylid 8", "text": "Ja, ik denk het wel."}, {"role": "Voorzitter", "text": "Het doet me denken aan die storm van afgelopen... november of zo. Wat een storm! Precies midden in een wedstrijd. (De derde jurylid loopt naar toilet.) We staan zeven punten achter, zes, maar we beginnen net de bal te verplaatsen, buiten de tackle, weet je. Boem! Boem! Jongen, dat zal ik nooit vergeten. We hadden die jongen Slattery. Een echte krachtpatser. Ik wou dat ik er nog een zoals hem had. Oh. Ik ben waarschijnlijk vergeten je te vertellen dat ik assistent-hoofdcoach voetbal ben op de Andrew J. NcCorckle High School. Dat is in Queens. (de 8e jurylid glimlacht even) Maar goed, we gaan heel goed. Hun verdediging valt uit elkaar. Ik zeg je, die Slattery. Jongen! En plotseling begint het te lukken. En toen die regen. Binnen twee minuten stond de modder je bijna tot aan je kont. Wedstrijd gestaakt. En wat denk je bij hervatting van de wedstrijd draaide alles om….."}, {"role": "Jurylid 7", "text": "Hé, laten we proberen deze ventilator hier aan de praat te krijgen. Wat zeg je ervan? (De vierde jurylid komt terug van de toilet en blijft wat hangen bij de deur. De voorzitter gaat naar de bank, gaat erop staan en zet de ventilator aan.Intussen komt 3e jurylid terug uit het toilet en blijft bij 4 jurylid staan.) Het zit vast ergens aan vast."}, {"role": "Jurylid 3", "text": "(tegen 4e jurylid) Nou, wat vind je ervan? Het is gelijk op. Een beetje verrassend, nietwaar?"}, {"role": "Jurylid 4", "text": "Ja"}, {"role": "Jurylid 3", "text": "Luister, dat voorval van daarnet, toen die vent me uitdaagde. Dat bewijst nog niets. Luister, ik ben een erg opgewonden persoon, weet je. Dus waar haalt hij het recht vandaan om me een publieke wreker en een sadist en zo te noemen? Iedereen met gezond verstand zou uit zijn dak gaan, nietwaar? Hij probeerde me gewoon uit te lokken."}, {"role": "Jurylid 4", "text": "Dat heeft hij uitstekend gedaan."}, {"role": "Jurylid 3", "text": "Oké, misschien deed hij dat wel. Ik heb je gezegd dat ik daar niets aan kan doen. Ik ben nu eenmaal zo, dit raakt me. Maar geloof me, ik ben oprecht."}, {"role": "Jurylid 4", "text": "Maar dat zijn we allemaal. (De tiende jurylid stormt uit het toilet en ziet de juryleden)"}, {"role": "Jurylid 10", "text": "Nou, dit is niet te geloven? Zes tegen zes. Het is een grap."}, {"role": "Jurylid 3", "text": "Wat gaan we eraan doen? Kunnen we het niet op de een of andere manier doorbreken?"}, {"role": "Jurylid 10", "text": "Die zes klootzakken daarbinnen zullen hun mening niet veranderen."}, {"role": "Jurylid 4", "text": "Vijf van hen zijn al van gedachten veranderd. Er is geen reden waarom ze niet opnieuw kunnen worden overgehaald."}, {"role": "Jurylid 10", "text": "Hoe dan?"}, {"role": "Jurylid 4", "text": "Gewoon door logica te gebruiken."}, {"role": "Jurylid 10", "text": "Logica! Jeetje!"}, {"role": "Jurylid 3", "text": "Luister nu eens naar deze man. Hij is de enige in deze kamer die weet..."}, {"role": "Jurylid 10", "text": "Wil je mijn mening? Ik denk dat we gewoon moeten stoppen."}, {"role": "Jurylid 3", "text": "Waar heb je het in godsnaam over?"}, {"role": "Jurylid 10", "text": "Die mensen daarbinnen doen ineens alsof het een soort missie is of zo. Luister, ze gaan niet van mening veranderen, dus laten we het aan de rechter vertellen, anders zitten we hier de hele nacht. Laten we hem in godsnaam vertellen dat we vastzitten. Weg hier. Ik bedoel, wat moet ik doen, mijn hoofd breken over dat uitschot?"}, {"role": "Jurylid 3", "text": "Nou, dat is het meest belachelijke wat ik ooit... Je hebt een eed afgelegd in de rechtszaal. Je kunt niet zomaar stoppen."}, {"role": "Jurylid 10", "text": "Waarom niet?"}, {"role": "Jurylid 3", "text": "“ Dat is oneerlijk. Waarom stem je niet voor 'niet schuldig'?"}, {"role": "Jurylid 10", "text": "Ik heb voor schuldig gestemd omdat ik denk dat hij schuldig is."}, {"role": "Jurylid 3", "text": "Maar het kan je niet schelen wat er met hem gebeurt?"}, {"role": "Jurylid 10", "text": "Nee. Waarom zou ik?"}, {"role": "Jurylid 4", "text": "Oké, laten we hiermee stoppen. Zo komen we nergens."}, {"role": "Jurylid 10", "text": "Wat wil hij dan? Ik heb mijn eerlijke mening gegeven."}, {"role": "Jurylid 4", "text": "Ik weet het."}, {"role": "Jurylid 10", "text": "Je vindt het dus niet zo belangrijk?"}, {"role": "Jurylid 4", "text": "Nee,dat vind ik niet. (De voorzitter komt naar hen toe)"}, {"role": "Voorzitter", "text": "Eh... we willen hier graag weer verder gaan, als u het niet erg vindt."}, {"role": "Jurylid 10", "text": "(tegen de derde jurylid) Wat vindt je ervan? Is dat iets?"}, {"role": "Jurylid 3", "text": "Een verdeelde jury betekent niets. Ze moeten gewoon het proces opnieuw beginnen met een andere jury. Daar zijn we hier niet voor."}, {"role": "Jurylid 10", "text": ". Wat maakt het nou uit? Je krijgt toch een jury die het niet eens kan worden."}, {"role": "Voorzitter", "text": "Luister, zou je alsjeblieft..."}, {"role": "Jurylid 10", "text": "(Hardop) Luister, ik zal je vertellen wat ik denk. We komen hier nergens. Ik ben klaar om nu meteen naar de rechtbank te gaan en te verklaren dat de jury geen uitspraak kan doen."}, {"role": "Jurylid 7", "text": "Ik ben het daar ook mee eens. Laten we het aan de rechter voorleggen en de jongen zijn kans laten wagen met twaalf andere mensen."}, {"role": "Jurylid 8", "text": "Ik denk niet dat de rechtbank een verdeelde jury zal accepteren. We zijn hier nog niet zo lang."}, {"role": "Jurylid 10", "text": "Laten we het toch maar proberen."}, {"role": "Jurylid 11", "text": "Ik ben hier geen voorstander van."}, {"role": "Jurylid 7", "text": "Luister, deze jongen zou bij een andere jury geen schijn van kans maken en dat weet je. (tegen de anderen) Kom op, we zitten vast. Niemand zal zijn mening veranderen. Laten we naar binnen gaan."}, {"role": "Jurylid 5", "text": "Denk je nog steeds dat er geen ruimte is voor redelijke twijfel?"}, {"role": "Jurylid 10", "text": "Nee, dat denk ik niet."}, {"role": "Jurylid 11", "text": "Pardon. Misschien begrijpt u de term 'redelijke twijfel' niet helemaal?"}, {"role": "Jurylid 7", "text": "Hoezo, ik begrijp het niet? Wie ben jij om zo tegen mij te praten? (tegen de anderen) Wat vinden jullie van deze vent? Ik zeg je ze zijn allemaal hetzelfde. Hij komt naar dit land om te vluchten voor zijn leven en voordat hij zelfs maar op adem kan komen, vertelt hij ons hoe we het moeten doen. Wat een arrogantie!"}, {"role": "Jurylid 5", "text": "(tegen de 7e jurylid) Je bedoelt dat je hem arrogant noemt omdat hij hier niet geboren is? Prima, dan noem ik jou arrogant omdat jij dat wel bent. Wat vind je daarvan?"}, {"role": "Jurylid 11", "text": "Alsjeblieft, alsjeblieft. Het maakt niet uit."}, {"role": "Jurylid 10", "text": "Luister, vriend, niemand hier gaat mij vertellen welke woorden ik begrijp en welke niet. (Hij wijst naar de 11e jurylid) Vooral hij niet."}]}, {"title": "SCENE 11 Plausibel Alibi", "cards": [{"role": "Voorzitter", "text": "Oké. Laten we stoppen met ruziën. Kunnen we ons niet bij het onderwerp houden?"}, {"role": "Jurylid 8", "text": "Ik wil graag iets bespreken, als iedereen dat goed vindt. Een belangrijk punt voor de aanklager was het feit dat de jongen, nadat hij had beweerd dat hij in de bioscoop was tijdens het tijdstip van de moord, niet kon zeggen welke film hij had gezien of welke sterren daarin speelden. {Hij wijst naar de vierde jurylid.) Deze heer heeft dat punt hier meerdere keren herhaald."}, {"role": "Jurylid 4", "text": "Dat klopt. Het was het enige alibi dat de jongen had en hij kon het zelf helemaal niet met details staven."}, {"role": "Jurylid 8", "text": "Als u zich in de plaats van de jongen zou kunnen verplaatsen, denkt u dan dat u zich details zou kunnen herinneren na een schokkende ervaring, zoals door uw vader in het gezicht geslagen worden?"}, {"role": "Jurylid 4", "text": "Ik denk het wel, als er speciale details waren om te onthouden. Hij kon zich de films in de bioscoop die hij noemde niet herinneren omdat hij er die avond niet was."}, {"role": "Jurylid 8", "text": "Volgens de getuigenis van de politie in de rechtbank werd hij door de politie ondervraagd in de keuken van zijn appartement, terwijl het lichaam van zijn vader op de vloer in de slaapkamer lag. Denkt u dat u zich onder dergelijke omstandigheden details zou kunnen herinneren?"}, {"role": "Jurylid 4", "text": "Ja, dat kan ik."}, {"role": "Jurylid 8", "text": "Onder grote emotionele druk"}, {"role": "Jurylid 4", "text": "Ook onder grote emotionele druk."}, {"role": "Jurylid 8", "text": "Hij herinnerde zich de films in de rechtbank. Hij noemde ze correct en hij noemde de sterren die erin speelden."}, {"role": "Jurylid 4", "text": "Ja, zijn advocaat heeft veel moeite gedaan om dat naar voren te brengen. Hij had drie maanden de tijd, vanaf de avond van de moord tot de dag van het proces, om ze uit zijn hoofd te leren. Ik geloof de getuigenis van de politieagent die hem direct na de moord ondervroeg, toen hij zich niets meer kon herinneren over de films, ongeacht of hij onder grote emotionele druk stond of niet."}, {"role": "Jurylid 8", "text": "Ik wil u graag een persoonlijke vraag stellen. Waar was u gisteravond?"}, {"role": "Jurylid 4", "text": "Ik was thuis."}, {"role": "Jurylid 8", "text": "En eergisterenavond?"}, {"role": "Jurylid 10", "text": "Kom op, wat is dit?"}, {"role": "Jurylid 4", "text": "Ik ben van de rechtbank naar mijn kantoor gegaan en daar tot half negen gebleven. Daarna ben ik meteen naar huis gegaan om te gaan slapen."}, {"role": "Jurylid 8", "text": "En de avond daarvoor?"}, {"role": "Jurylid 4", "text": "Dat was... dinsdag. Ik... was... oh ja. Dat was de avond van het bridgetoernooi. Ik heb bridge gespeeld."}, {"role": "Jurylid 8", "text": "En maandagavond?"}, {"role": "Jurylid 7", "text": "Laat me even weten als we bij oudjaarsavond zijn."}, {"role": "Jurylid 4", "text": "(probeert zich te herinneren) Maandag. (hij pauzeert) Maandagavond. (hij herinnert het zich) Maandagavond zijn mijn vrouw en ik naar de bioscoop geweest."}, {"role": "Jurylid 8", "text": "Wat hebben jullie gezien?"}, {"role": "Jurylid 4", "text": "The Scarlet Circle."}, {"role": "Jurylid 8", "text": "Welke film kwam daarna?"}, {"role": "Jurylid 4", "text": "De... Ik vertel het je zo meteen. De... Opmerkelijke mevrouw iets. Mevrouw... eh... Mainbridge. Nee, Bainbridge. De opmerkelijke mevrouw Bainbridge."}, {"role": "Jurylid 2", "text": "Nee die heet De verbazingwekkende mevrouw Bainbridge."}, {"role": "Jurylid 4", "text": "De... Verbazingwekkende mevrouw Bainbridge. Ja. Ik denk dat dat klopt."}, {"role": "Jurylid 8", "text": "Wie speelde Mrs. Bainbridge?"}, {"role": "Jurylid 4", "text": "Barbara ….Long, denk ik. Een mooie, jonge actrice. Barbara…..Lang….Land… zoiets."}, {"role": "Jurylid 8", "text": "Wie nog meer?"}, {"role": "Jurylid 4", "text": "Nou, ik had er nog nooit van gehoord. Het was een erg goedkope tweede film, met onbekende..."}, {"role": "Jurylid 8", "text": "En je stond niet onder emotionele druk, toch?"}, {"role": "Jurylid 4", "text": "Nee, dat was ik niet."}, {"role": "Jurylid 9", "text": "Ik denk dat het punt duidelijk is."}, {"role": "Jurylid 10", "text": "Welk punt?"}, {"role": "Jurylid 9", "text": "Ik denk dat het een belangrijk punt is?"}, {"role": "Jurylid 10", "text": "Wat? Alleen omdat hij zich naam van een of andere onbeduidende filmster niet meer weet? Dat bewijst toch dat die jongen in de bioscoop was."}, {"role": "Jurylid 9", "text": "Nee. Maar het geeft wel aan dat niemand kan bewijzen dat hij er niet was. Hij kan in de bioscoop zijn geweest en vergeten zijn wat hij heeft gezien. Dat is mogelijk. Als het volkomen normaal is voor deze heer... (hij wijst naar de 4e jurylid) om een paar details te vergeten, dan is dat ook volkomen normaal voor de jongen. Beschuldigd worden van moord betekent niet noodzakelijkerwijs dat hij een feilloos geheugen moet hebben."}, {"role": "Jurylid 10", "text": "(tegen de 9e jurylid) Je kunt praten tot je tong op de grond ligt. De jongen is schuldig. Punt uit. Begrijp je wat ik bedoel?"}, {"role": "Voorzitter", "text": "Weet je, er is iets wat we vergeten. Ik was net aan het denken aan... Nou ja, dat hele gedoe dat eindeloos aansleepte, weet je wel, met die psychiater, waar hij helemaal bij betrokken raakte..."}, {"role": "Jurylid 10", "text": "Begin nu niet met al dat nep psycho-hoe-je-het-ook-noemt gedoe. Wat een onzin is dat! Mensen hun hoofd vullen met al die onzin. Luister, ik heb drie psychiaters die hun auto's in een van mijn garages stallen. Ze zijn alle drie gek."}, {"role": "Voorzitter", "text": "Luister, ik probeer iets duidelijk te maken. Vind je het erg?"}, {"role": "Jurylid 10", "text": "Ik zou geen cent geven voor de getuigenis van een psychiater."}, {"role": "Jurylid 8", "text": "Waarom laat je die man niet uitpraten? Je kunt vijf minuten nemen om te praten over de nutteloosheid van de psychiatrie als hij klaar is."}, {"role": "Voorzitter", "text": "Wat ik wilde zeggen was, de psychiater verklaarde ondubbelzinnig dat de jongen sterke moordneigingen had. Ik bedoel, dat hij, hoe zeg je dat ook alweer, in staat was om een moord te plegen. Hij beschreef al die tests, inktvlekken en al dat soort dingen, en hij zei dat de jongen absoluut een moordenaarstype was. Klopt dat?"}, {"role": "Jurylid 12", "text": "Klopt. Ik denk dat hij iets zei over paranoïde neigingen, als ik me niet vergis."}, {"role": "Voorzitter", "text": "Juist. Wat dat ook is, hij heeft het gezegd. Laten we niet vergeten dat we het hebben over een jongen die altijd al moord in zijn hoofd had."}, {"role": "Jurylid 12", "text": "Zijn onderbewustzijn."}, {"role": "Voorzitter", "text": "Van niemand anders."}, {"role": "Jurylid 11", "text": "Neem me niet kwalijk, bij het bespreken van..."}, {"role": "Jurylid 10", "text": "Neem me niet kwalijk? Waarom bent u zo verdomd beleefd?"}, {"role": "Jurylid 11", "text": "Om dezelfde reden waarom jij dat niet bent. Zo ben ik opgevoed. (Hij wendt zich tot de anderen) Bij het bespreken van zaken als moordpotentieel moeten we niet vergeten dat velen van ons in staat zijn om moord te plegen. Maar slechts weinigen van ons doen dat ook. We leggen onszelf beperkingen op om dat te voorkomen. Het maximale dat deze psychiatrische tests kunnen bereiken. In dit daglicht is het volgende: ze kunnen ons vertellen dat een bepaalde persoon op een dag een moord zou kunnen plegen. Dat is alles. Ze bewijzen niets."}, {"role": "Jurylid 4", "text": "Waarom worden ze dan als bewijs toegelaten?"}, {"role": "Jurylid 11", "text": "Ze hebben natuurlijk vele toepassingen. In dit geval droegen ze bij aan de algemene indruk die de aanklager probeerde te creëren. Misschien zouden we ontdekken dat als wij twaalf personen dezelfde tests zouden nemen, een of twee van ons misschien zouden ontdekken dat we onbewuste verlangen om te doden, en de mogelijkheid om dat ook daadwerkelijk te doen. Maar niemand van ons heeft dat. Zeggen dat een man in staat is tot moord, betekent niet dat hij ook daadwerkelijk moord heeft gepleegd."}, {"role": "Jurylid 10", "text": "Maar het kan wel zo bedoeld zijn. Luister, als ze zeiden dat het kind in staat is om te doden, dan had hij kunnen doden, toch?"}, {"role": "Jurylid 8", "text": "Jij bent degene die zei, en ik citeer: \"Ik zou geen cent geven voor de getuigenis van een psychiater.\""}, {"role": "Jurylid 10", "text": "Jongen, ik zeg je... (hij loopt naar de 8e jurylid) Ik zou graag... (Hij stopt. De 8e jurylid kijkt niet op naar hem. De 10e jurylid loopt boos weg.)"}, {"role": "Jurylid 6", "text": "Hoe laat is het?"}, {"role": "Jurylid 7", "text": "Het is vijf over zes. Man, kijk eens naar die regen. Daar gaat mijn honkbalwedstrijd."}, {"role": "Jurylid 2", "text": "(tegen de 8e jurylid) Zeg, mag ik dat mes even zien? (De 8e jurylid schuift het mes over de tafel naar de 2e jurylid, die het opent en onderzoekt.)"}]}, {"title": "SCENE 12 Onderhandse steektechniek.", "cards": [{"role": "Voorzitter", "text": "Nou, we staan nog steeds gelijk met zes tegen zes. Wie heeft er een suggestie?"}, {"role": "Jurylid 12", "text": "Ik wel. Laten we gaan eten."}, {"role": "Jurylid 5", "text": "Waarom wachten we niet tot zeven uur? Geef het nog een uur."}, {"role": "Jurylid 12", "text": "Dat vind ik prima."}, {"role": "Jurylid 2", "text": "Eh... er is iets wat ik graag wil zeggen. Ik bedoel, het zit me een beetje dwars en nu we toch vastzitten... Nou, er was die hele kwestie over de steekwond en hoe die was toegebracht, de neerwaartse hoek ervan, weet je?"}, {"role": "Jurylid 3", "text": "Zeg me niet dat we daar nu over beginnen. Het is keer op keer besproken."}, {"role": "Jurylid 2", "text": "Ik weet dat ze dat hebben gedaan, maar ik ga daar niet in mee. De jongen is 1,70 meter lang. Zijn vader was 1,88 meter. Dat is een verschil van centimeter. Het is erg lastig om iemand die meer dan 15 centimeter langer is dan jij in de borst te steken."}, {"role": "Jurylid 3", "text": "(loopt naar 2e jurylid en wijst naar het mes) Geef dat eens hier. (De 2e jurylid geeft het mes aan de 3e jurylid.) Luister, je zult pas tevreden zijn als je het nog eens ziet. Ik zal het je laten zien. Kan iemand opstaan? (Er valt een stilte. Niemand beweegt, totdat de achtste jurylid opstaat en naar de derde jurylid loopt. Ze staan elkaar aan te kijken.) Oke. Let nu goed op. Ik wil dit niet nog een keer hoeven doen. (Hij wendt zich tot de 8e jurylid, kijkt hem recht aan en hurkt om zichzelf kleiner te maken) Ik ben zo'n vijftien centimeter kleiner dan jij. Klopt dat?"}, {"role": "Jurylid 2", "text": "Dat klopt. Misschien iets meer."}, {"role": "Jurylid 3", "text": "Oké. Laat het dan maar wat meer zijn. (Hij klapt het mes open, verandert de positie ervan in zijn hand en houdt het omhoog, klaar om naar beneden te steken. De 8e jurylid en de 3e jurylid kijken elkaar strak aan, waarna de 3e jurylid plotseling hard naar beneden steekt.)"}, {"role": "Jurylid 2", "text": "Kijk uit! (Het mes stopt ongeveer 2,5 cm voor de borst van het 8ste jurylid. De 8e jurylid beweegt niet. De 3e jurylid glimlacht.)"}, {"role": "Jurylid 6", "text": "Dat is niet grappig."}, {"role": "Jurylid 5", "text": "Ben je wel helemaal lekker?"}, {"role": "Jurylid 3", "text": "Rustig maar. Niemand is gewond. Toch?"}, {"role": "Jurylid 8", "text": "Nee. Niemand is gewond."}, {"role": "Jurylid 3", "text": "Oké. Zo zou ik een langere man in de borst steken en zo is het gedaan. Ga je gang en zeg me dat ik het mis heb. (De derde jurylid geeft het mes aan de achtste jurylid en loopt weg. De twaalfde jurylid loopt naar de achtste jurylid en doet met zijn gesloten hand alsof hij de achtste jurylid in de borst steekt.)"}, {"role": "Jurylid 12", "text": "Omlaag en naar binnen. Klopt helemaal."}, {"role": "Jurylid 5", "text": "(loopt naar de 8e jurylid) Wacht even. Geef dat eens hier. (De 8e jurylid geeft het mes aan de 5e jurylid. Hij sluit het mes en houdt het voorzichtig vast.) Ik haat deze dingen. Ik ben ermee opgegroeid."}, {"role": "Jurylid 8", "text": "Heb je ze weleens in gevechten zien gebruiken?"}, {"role": "Jurylid 5", "text": "Te vaak. Op mijn stoep. In mijn achtertuin. Op het terrein aan de overkant van de straat. Stiletto’s hoorden bij de buurt waar ik woonde. Grappig, daar had ik niet aan gedacht. Ik denk dat je dat soort dingen probeert te vergeten. Je kunt dit soort messen niet op die manier gebruiken. Je moet het zo vasthouden om het mes los te maken. Om naar beneden te steken, zou je je greep moeten veranderen."}, {"role": "Jurylid 8", "text": "Hoe gebruik je het?"}, {"role": "Jurylid 5", "text": "Onderhands. (Hij klapt het mes open, houdt het onderhands vast, zwaait rond en haalt snel naar voren en omhoog uit.) Zo dus. Iedereen die ooit een stiletto gebruikt, zou het nooit op een andere manier hanteren op een andere manier."}, {"role": "Jurylid 8", "text": "Weet u dat zeker?"}, {"role": "Jurylid 5", "text": "Ik weet het zeker. (Hij sluit het mes en klapt het weer open) Daarom zijn ze zo gemaakt."}, {"role": "Jurylid 8", "text": "Iedereen was het erover eens dat de jongen behoorlijk handig met een mes, nietwaar?"}, {"role": "Jurylid 5", "text": "Dat klopt."}, {"role": "Jurylid 8", "text": "Denk je dat hij het soort wond zou hebben toegebracht dat zijn vader fataal werd?"}, {"role": "Jurylid 5", "text": "Niet met de ervaring die hij had met dit soort dingen. Nee, ik denk het niet. Hij zou hem van achteren aanvallen…"}, {"role": "Jurylid 3", "text": "Hoe weet u dat? Wat... was u in de kamer toen de vader werd vermoord?"}, {"role": "Jurylid 5", "text": "Nee, en niemand anders ook. Hij steekt het mes in de tafel en loopt weg."}, {"role": "Jurylid 3", "text": "(tegen de 8e jurylid) Wat een hoop onzin. Ik geloof er niets van."}, {"role": "Jurylid 4", "text": "Ik denk niet dat je kunt bepalen wat voor soort wond deze jongen wel of niet zou hebben gemaakt, simpelweg omdat hij weet hoe hij met een mes moet omgaan."}, {"role": "Jurylid 3", "text": "Precies"}, {"role": "Jurylid 8", "text": "(kijkt naar de 12e jurylid) Wat denk je ervan?"}, {"role": "Jurylid 12", "text": "Nou... ik weet het niet..."}, {"role": "Jurylid 3", "text": "Hoezo, je weet het niet?"}, {"role": "Jurylid 12", "text": "Ik weet het niet. Akte 5 Escalaties"}]}, {"title": "SCENE 13 VERANTWOORD JE KEUZE", "cards": [{"role": "Jurylid 8", "text": "(tegen de 7e jurylid) En jij?"}, {"role": "Jurylid 4", "text": "Wacht even. Volgens de vrouw aan de overkant van de straat…"}, {"role": "Jurylid 7", "text": "Luister, ik zal je iets vertellen. Ik ben dit hele gedoe al een beetje zat. Al dat geklets leidt nergens toe, dus ik ga het hier beëindigen. Ik verander mijn stem in 'niet schuldig'."}, {"role": "Jurylid 3", "text": "Wat zeg je?"}, {"role": "Jurylid 7", "text": "Je hebt me gehoord. Ik heb er genoeg van."}, {"role": "Jurylid 3", "text": "Wat bedoel je met 'je hebt er genoeg van'? Dat is geen antwoord."}, {"role": "Jurylid 7", "text": "Hé, luister eens! Bemoei gewoon met jezelf!"}, {"role": "Jurylid 11", "text": "(loopt naar de 7e jurylid) Hij heeft gelijk. Dat is geen antwoord. Wat ben jij voor iemand? Je hebt hier gezeten en samen met alle anderen voor schuldig gestemd, maar omdat je een paar honkbalkaartjes in uw zak hebt zitten branden, verander je je stem en zegt dat je genoeg hebt van al dat gepraat hier."}, {"role": "Jurylid 7", "text": "Luister eens, vriend..."}, {"role": "Jurylid 11", "text": "Je hebt niet het recht om zo te spelen met iemands leven. Dit is vreselijk en afschuwelijk. Kan het je niets schelen...?"}, {"role": "Jurylid 7", "text": "Wacht even. Zo mag je niet tegen zo tegen mij praten!"}, {"role": "Jurylid 11", "text": "Ik mag wel zo tegen je praten. Als je wilt stemmen voor 'niet schuldig', doe dat dan omdat je ervan overtuigd bent dat de man niet schuldig is, niet omdat je er genoeg van hebt. En als je denkt dat hij schuldig is, stem dan ook zo. Of durft je niet te doen wat u denkt dat juist is?"}, {"role": "Jurylid 7", "text": "Luister nu eens…"}, {"role": "Jurylid 11", "text": "Schuldig of niet schuldig?"}, {"role": "Jurylid 7", "text": "Ik zei het je toch: niet schuldig."}, {"role": "Jurylid 11", "text": "Waarom?"}, {"role": "Jurylid 7", "text": "Verdomme. Ik hoef niet..."}, {"role": "Jurylid 11", "text": "Dat moet je wel. Zeg het. Waarom?"}, {"role": "Jurylid 7", "text": "(met zachte stem) Ik... denk niet dat hij schuldig is. (De 11e jurylid kijkt het 7e jurylid verontwaardigd aan en gaat vervolgens naar zijn stoel. Het 7e jurylid kijkt verslagen.)"}, {"role": "Jurylid 8", "text": "Voorzitter, ik wil nog een stemming."}, {"role": "Voorzitter", "text": "Oké, er wordt opnieuw gestemd. (De juryleden gaan naar hun stoelen en gaan zitten) Ik denk dat handopsteken de snelste manier is. Heeft iemand bezwaar? (er komt geen antwoord) Iedereen die voor 'niet schuldig' stemt, steekt uw hand op. (De 2e, 3e, 6e, 7e, 8e, 9e en 11e juryleden steken onmiddellijk hun hand op.) Eén. Twee. Drie. Vier. Vijf. Zes. Zeven. (Het 12e jurylid twijfelt, maar dan steekt hij plotseling zijn hand op) Acht. (Hij stopt met tellen en kijkt rond de tafel. Langzaam, bijna beschaamd, steekt hij zijn eigen hand op.) Negen. (hij laat zijn hand zakken) Iedereen die voor schuldig stemt. (De 3e, 4e en 10e juryleden steken hun hand op.) Negen tegen drie voor niet schuldig."}]}, {"title": "SCENE 14 RELAAS 10e Jurylid", "cards": [{"role": "Jurylid 10", "text": "Ik begrijp jullie niet. Ik bedoel, al die pietluttige details die jullie blijven aanhalen. Die betekenen niets. Hoe kunnen jullie zijn verhaal geloven? (tegen de 11e jurylid) Je bent een intelligent man. Nou, je gaat me toch niet vertellen dat je dat niet bent. Je kent de feiten van het leven. Nou, kijk in godsnaam eens naar waar we hier mee te maken hebben. Je kent hem! Ik bedoel, die vent... (Hij wijst naar de 8e jurylid) Daar, nou, ik weet niet wat er met hem aan de hand is. Al dat gepraat over psychiaters. Misschien moet hij zelf maar eens naar een psychiater gaan. Laten we het over feiten hebben. Deze mensen zijn geboren om te liegen. Zo zijn ze nu eenmaal en geen enkele intelligente man kan mij van het tegendeel overtuigen. Ze weten niet wat de waarheid is. Kijk maar eens naar ze. Ze zijn anders. Ze denken anders. Ze gedragen zich anders. Ze hebben bijvoorbeeld geen groot excuus nodig om iemand te vermoorden. (Het 5de jurylid loopt naar de deur van het toilet.) Nou, dat is waar. Iedereen weet dat. Ze worden dronken of stoned. Oh, het zijn flinke gebruikers, junks, uitschot. (Het 5de jurylid gaat de wc binnen en slaat de deur achter zich dicht.) Stoere vent! Kijk hem eens, een beetje met deuren slaan als ze het niet zint. Verdomme waar was ik. Oh ja en dan zijn ze dronken of stoned, en ineens - bang - ligt er iemand dood in de goot. Oké, niemand geeft hen daar de schuld van. Zo zijn ze nu eenmaal van nature, snap je wat ik bedoel? Gewelddadig! Menselijk leven betekent niet zoveel voor hen als voor ons. (De 11e jurylid staat op en loopt naar de deur van het toilet.) Waar ga je heen? (De elfde jurylid geeft geen antwoord en gaat naar het toilet.) Terwijl je daar bent, let dan meteen even op je geld. Of pas op dat je niet wat in je neus poedert. (De 4e jurylid staat op en loopt naar het raam.) Luister eens naar me. Deze mensen drinken zich lam en vechten de hele tijd, en als er iemand wordt vermoord, dan wordt er iemand vermoord. Het kan ze niets schelen. Familie betekent niets voor hen. Ze planten zich voort als dieren. Vaders, moeders, dat betekent niets. Oh, natuurlijk, er zijn ook goede dingen aan hen. Kijk, ik ben de eerste om dat te zeggen. Ik heb er een paar gekend die oké waren, maar dat is de uitzondering."}, {"role": "Jurylid 9", "text": "Weet je dat je een hele zieke geest hebt?"}, {"role": "Jurylid 10", "text": "Ziek?"}, {"role": "Jurylid 9", "text": "Misschien kun je beter gaan zitten en je mond houden."}, {"role": "Jurylid 10", "text": "Jij oude klootzak! Wie ben jij in godsnaam? (Hij loopt naar de 9e jurylid. De"}, {"role": "Jurylid 12", "text": "gaat tussen de 9e en de 10e jurylid staan. Spreekt tegen de 12e jurylid) Nee. Wie denkt hij wel dat hij is om mij dat te vertellen? Walgelijk. Kijk hem eens, hij kan amper staan. Luister, ik zeg wat ik te zeggen heb en jij luistert. (De 9e jurylid loopt naar het raam.)"}, {"role": "Jurylid 12", "text": "Misschien is het inderdaad beter als je gewoon even stil zou zijn?"}, {"role": "Jurylid 10", "text": "Stil zijn! Waarom zou ik stil zijn. Ik zeg wat iedereen hier denkt maar te laf is om zijn bek open te trekken. Maar ik zal verdomme wel rustig zijn. Geen van hen is iets waard, geen enkele die iets waard is. Hoor je dat? Geen enkele. Laat me dit even uitleggen aan jullie onwetende klootzakken. (tegen de 9e jurylid) Jij daar bij het raam, je bent zo verdomd slim. We staan hier voor een gevaar. Weet je dat dan niet? Deze mensen vermenigvuldigen zich. Die jongen die terechtstaat, zijn soort, die vermenigvuldigen zich vijf keer zo snel als wij. Dat is de statistiek. Vijf keer. En het zijn... wilde dieren. Ze zijn tegen ons, ze haten ons, ze willen ons vernietigen. Dat klopt. (tegen de zesde jurylid) Kijk me niet zo aan! Er is gevaar. In godsnaam, we leven in gevaarlijke tijden, en als we niet oppassen, als we ze niet neerslaan wanneer we maar kunnen, dan zullen ze ons in hun macht krijgen. Ze zullen ons uitroeien."}, {"role": "Jurylid 6", "text": "Ach, houd je mond!"}, {"role": "Jurylid 10", "text": "Nu moeten jullie verdomde genieën beter naar me luisteren. Ze zijn gewelddadig, ze zijn wreed, ze zijn onwetend en ze zullen ons afmaken. Dat is hun bedoeling. Ons afmaken. (tegen de 7e jurylid) Ik waarschuw je. Deze jongen, deze jongen die hier terechtstaat. We hebben hem te pakken. Dat is er tenminste één. Ik zeg: pak hem voordat zijn soortgenoten ons pakken. Ik geef geen moer om de wet. Waarom zou ik? Zij geven er ook niets om."}, {"role": "Jurylid 2", "text": "Ik heb genoeg gehoord. Hou nu maar op met dit alles."}, {"role": "Jurylid 10", "text": "(kijkt boos naar de 2e jurylid) Oh nu kun je wel je bek open trekken. Als je niets zinnigs te zeggen dan ram ik die wel weer even dicht, slimme kleine klootzak? Waar haal je gore lef vandaan om...? (De vierde jurylid stapt voor de tiende jurylid en houdt hem resoluut tegen.)"}, {"role": "Jurylid 4", "text": "En nu houd jij je bek dicht. We hebben genoeg gehoord. Ga zitten! En open je smerige mond niet meer. (De 4e en 10e jurylid staren elkaar aan. Uiteindelijk draait het 10e jurylid zich om, loopt naar een stoel en gaat met zijn rug naar de anderen zitten. De andere juryleden lopen langzaam naar hun stoelen.)"}, {"role": "Jurylid 8", "text": "Het is erg moeilijk om je persoonlijke vooroordelen uit te schakelen. En vooroordelen verhullen de waarheid. (stilte) Ik weet ook niet wat de waarheid is. Niemand zal dat ooit weten, denk ik. Maar negen van ons lijken nu te vinden dat de verdachte onschuldig is, maar we gokken alleen maar op waarschijnlijkheden. Misschien hebben we het mis. Misschien proberen we een schuldige man terug te sturen naar de samenleving. Niemand kan dat echt weten. Maar we hebben redelijke twijfel, en dat is een waarborg die enorm waardevol is in ons systeem. Geen enkele jury kan iemand schuldig verklaren tenzij ze het zeker weten. Wij negen kunnen niet begrijpen hoe jullie drie nog steeds zo zeker kunnen zijn. Misschien kunt u ons dat vertellen."}]}, {"title": "SCENE 15 DE VROUW IN DE TREIN", "cards": [{"role": "Jurylid 4", "text": "Ik zal het proberen. Je hebt een aantal uitstekende argumenten aangevoerd. Het laatste argument, waarin u 'bewees' dat de jongen niet het soort steek met de bovenhand kon hebben uitgevoerd dat zijn vader doodde, was erg overtuigend. Maar ik geloof nog steeds dat de jongen schuldig is aan moord. Ik heb twee redenen. Ten eerste: het bewijs van de vrouw aan de overkant van de straat die de moord daadwerkelijk heeft gezien."}, {"role": "Jurylid 3", "text": "Ja, precies. En hoe hij het deed. Wat mij betreft is dat de belangrijkste getuigenis in de hele zaak."}, {"role": "Jurylid 4", "text": "En ten tweede: het feit dat deze vrouw de steekpartij beschreef door te zeggen dat ze zag hoe de jongen zijn arm boven zijn hoofd hief en het mes in de borst van zijn vader stak. Ze zag hem het doen, op de verkeerde manier."}, {"role": "Jurylid 3", "text": "Dat klopt! Dat klopt helemaal!"}, {"role": "Jurylid 4", "text": "Laten we het nu eens even hebben over deze vrouw. Ze zei dat ze die avond rond elf uur naar bed was gegaan. Haar bed stond naast het raam en terwijl ze lag, kon ze rechtstreeks naar het raam van de jongen aan de overkant van de straat kijken. Ze woelde meer dan een uur lang heen en weer en kon niet in slaap komen. Uiteindelijk draaide ze zich om tien over twaalf naar het raam en toen ze naar buiten keek, zag ze de moord door de ramen heen van de voorbijrijdende trein. Ze zegt dat de lichten direct na de moord uitgingen, maar dat ze de jongen goed heeft kunnen zien terwijl hij zijn vader neerstak. Voor zover ik kan zien, is dit een onwrikbare getuigenis."}, {"role": "Jurylid 3", "text": "Dat is wat ik bedoel. Dat is de hele zaak."}, {"role": "Jurylid 4", "text": "(tegen 8e jurylid) Wat denk jij ervan? (Het 8e jurylid blijft stil. De 4e jurylid kijkt naar de 12e jurylid.) En jij?"}, {"role": "Jurylid 12", "text": "Nou... ik weet het niet. Er is zoveel veel bewijsmateriaal om door te nemen. Dit is een behoorlijk ingewikkelde zaak."}, {"role": "Jurylid 4", "text": "Eerlijk gezegd zie ik niet in hoe we voor vrijspraak kunnen stemmen."}, {"role": "Jurylid 12", "text": "Nou, het is niet eenvoudig om het bewijsmateriaal op orde te krijgen."}, {"role": "Jurylid 3", "text": "Je kunt al het andere bewijsmateriaal weggooien. De vrouw heeft hem het zien doen. Wat wil je nog meer?"}, {"role": "Jurylid 12", "text": "Nou, misschien..."}, {"role": "Jurylid 3", "text": "Laten we erover stemmen."}, {"role": "Voorzitter", "text": "Oké. Er is wederom om een stemming gevraagd. Heeft iemand bezwaar."}, {"role": "Jurylid 12", "text": "Ik verander mijn stem. Ik denk dat hij \"schuldig\" is."}, {"role": "Jurylid 3", "text": "Ha. (enthousiast) Nog iemand anders? De stemming is acht tegen vier."}, {"role": "Jurylid 11", "text": "(tegen de 3e jurylid) Waarom beschouw je deze ene stem als een persoonlijke overwinning?"}, {"role": "Jurylid 3", "text": "Ik ben nogal competitief ingesteld. (tegen de anderen) Oké. Dit is wat ik denk. Ik denk dat we een verdeelde jury hebben: laten we het voorleggen aan de rechter."}, {"role": "Jurylid 4", "text": "Je wilde eerder geen patstelling."}, {"role": "Jurylid 3", "text": "Nou, ik wil het nu."}, {"role": "Jurylid 4", "text": "Dat begrijp ik niet. Je vond dat het immoreel was om..."}, {"role": "Jurylid 3", "text": "Nu niet meer. Er zijn hier mensen hier zo verdomd koppig zijn dat je niet eens... We komen hier nooit uit. We zitten hier nog een week. Nou, ik zeg dat we een impasse hebben (hij wendt zich tot de 8e jurylid) Kom op. Jij bent de leider van de zaak. Wat vind jij ervan?"}, {"role": "Jurylid 8", "text": "Laten we het nog eens doornemen."}, {"role": "Jurylid 3", "text": "We hebben het nog eens doorgenomen. (Hij zwaait naar de 12e jurylid) Hij daar stuitert heen en weer als een tennisbal..."}, {"role": "Jurylid 12", "text": "Wacht even. Je hebt geen recht om... (De 4e jurylid neemt zijn bril af en poetst hem.)"}, {"role": "Jurylid 3", "text": "Ik bied mijn excuses aan op mijn knieën. (tot het 8e jurylid) Kom op, laten we proberen tot een besluit te komen."}, {"role": "Jurylid 4", "text": "Oké. Misschien kunnen we het hebben over het stellen van een soort tijdslimiet. (Terwijl hij zijn bril blijft poetsen, draait hij zich om en kijkt omhoog naar de klok.) Het is nu... (Hij knijpt zijn ogen samen en zet zijn bril op)"}, {"role": "Jurylid 3", "text": "Kwart over zes."}, {"role": "Jurylid 4", "text": "(kijkt naar de klok) Kwart over zes. Hij zet zijn bril af en legt die op tafel. (Hij sluit zijn ogen en legt zijn vingers op de afdrukken die zijn bril aan de zijkanten van zijn neus heeft achtergelaten. Hij wrijft over deze plekken. ) Iemand heeft eerder zeven uur genoemd. Ik denk dat dat een moment is waarop we kunnen beginnen met de vraag of we een verdeelde jury zijn of niet."}, {"role": "Jurylid 9", "text": "(tegen de 4e jurylid) Voel je je niet goed?"}, {"role": "Jurylid 4", "text": "Ik voel me prima, dank je. Ik zei dat zeven uur een redelijk tijdstip zou zijn om..."}, {"role": "Jurylid 9", "text": "De reden waarom ik daarnaar vroeg was omdat u over uw neus wreef alsof... Sorry dat ik u onderbreek, maar u maakte een gebaar dat deed denken aan..."}, {"role": "Jurylid 4", "text": "Ik probeer hier iets te vertellen. Vindt u het erg?"}, {"role": "Jurylid 9", "text": "Ik denk dat dit belangrijk is. Ik weet zeker dat u mij hiervoor zult vergeven, maar ik vroeg me af waarom u zo over uw neus wreef?"}, {"role": "Jurylid 3", "text": "Ach, kom op, doe eens normaal!"}, {"role": "Jurylid 9", "text": "9e jurylid Op dit moment ben ik toevallig in gesprek met deze heer hier. (tegen de 4e jurylid) Waarom wreef u over uw neus?"}, {"role": "Jurylid 4", "text": "Nou, als het je iets aangaat, ik wreef eraan omdat het me een beetje stoort."}, {"role": "Jurylid 9", "text": "Het spijt me. Is het vanwege je bril?"}, {"role": "Jurylid 4", "text": "Ja. Kunnen we nu verdergaan met iets anders?"}, {"role": "Jurylid 9", "text": "Uw bril zorgt voor diepe afdrukken achter op je neus. Dat was me nog niet eerder opgevallen. Dat moet vervelend zijn."}, {"role": "Jurylid 4", "text": "Ze zijn erg vervelend."}, {"role": "Jurylid 9", "text": "9e jurylid Dat weet ik niet. Ik heb nooit een bril gedragen."}, {"role": "Jurylid 7", "text": "Luister, wat zit je te zaniken over die bril"}, {"role": "Jurylid 9", "text": "De vrouw die getuigde dat ze de moord had gezien, deed dit ook. (Er valt een stilte in de kamer, gevolgd door lichte commotie.) Alsjeblieft. Nog even geduld, dan ben ik klaar. Ik weet niet of iemand anders dat aan haar opgevallen is. Ik heb er toen niet bij stilgestaan, maar ik heb haar gezicht steeds weer in mijn gedachten gehaald. Zij zat ook over haar neus te wrijven. Ze zette haar bril ook steeds af als ze weer iets moest lezen."}, {"role": "Jurylid 5", "text": "Hij heeft gelijk. Dat deed ze inderdaad vaak."}, {"role": "Jurylid 3", "text": "Ok, deze vrouw droeg een bril. Nou en er dragen wel meer mensen een bril."}, {"role": "Jurylid 8", "text": "(tegen 4e jurylid) Draag je je bril als je gaat slapen?"}, {"role": "Jurylid 4", "text": "Nee, dat doe ik niet. Niemand draagt een bril naar bed."}, {"role": "Jurylid 8", "text": "Het is logisch om te zeggen dat ze ze niet droeg ze droeg toen ze in bed lag, woelde en draaide, in een poging om in slaap te vallen."}, {"role": "Jurylid 3", "text": "Hoe weet u dat?"}, {"role": "Jurylid 8", "text": "Ik weet het niet. Ik gok maar wat. Ik denk dat ze waarschijnlijk haar bril niet op had gezet toen ze zich omdraaide en terloops uit het raam keek. En ze heeft zelf gezegd dat de moord plaatsvond net toen hij naar buiten keek, en dat de lichten een fractie van een seconde later uitgingen. Ze kan toen geen tijd hebben gehad om haar bril op te zetten."}, {"role": "Jurylid 3", "text": "Wacht even..."}, {"role": "Jurylid 8", "text": "En hier is nog een andere gok. Misschien oprecht dacht dat ze zag hoe de jongen zijn vader vermoordde. Ik zeg dat ze alleen een vage schim zag."}, {"role": "Jurylid 3", "text": "Hoe weet je wat ze zag? Hoe weet hij al deze dingen? (tegen 8e jurylid) Je weet niet wat voor bril ze droeg. Misschien was ze verziend of bijziend. Misschien was het een zonnebril. Wat weet jij ervan?"}, {"role": "Jurylid 8", "text": "Ik weet alleen dat het gezichtsvermogen van de vrouw nu aan de orde is."}, {"role": "Jurylid 11", "text": "Ze heeft een persoon geïdentificeerd die zich op 60 meter afstand bevond, in het donker, zonder bril."}, {"role": "Jurylid 2", "text": "Je kunt iemand niet ter dood veroordelen op basis van zulk bewijs."}, {"role": "Jurylid 3", "text": "Ach, schei uit!"}, {"role": "Jurylid 8", "text": "Denk je niet dat de vrouw een fout gemaakt?"}, {"role": "Jurylid 3", "text": "Nee"}, {"role": "Jurylid 8", "text": "Dat is niet mogelijk?"}, {"role": "Jurylid 3", "text": "Nee! Dat is niet mogelijk."}, {"role": "Jurylid 8", "text": "(tegen de 12e jurylid) Is het mogelijk?"}, {"role": "Jurylid 12", "text": "Ja. Ik wijzig mijn stem weer naar “niet schuldig”"}, {"role": "Jurylid 8", "text": "(tegen de 10e jurylid) Denk je dat hij schuldig is?"}, {"role": "Jurylid 10", "text": "Ja, ik denk dat hij schuldig is. Maar het kan me niets schelen. Doe maar wat jullie willen."}, {"role": "Jurylid 8", "text": "Hoe stem je?"}, {"role": "Jurylid 10", "text": "Niet schuldig. Doe maar wat je wilt."}, {"role": "Jurylid 3", "text": "Je bent de ergste klootzak... Ik denk dat hij schuldig is."}, {"role": "Jurylid 8", "text": "Is er nog iemand die denkt dat hij schuldig is?"}, {"role": "Jurylid 4", "text": "Nee, ik ben overtuigd."}, {"role": "Jurylid 3", "text": "Wat doe jij nou?"}, {"role": "Jurylid 4", "text": "Ik heb nu redelijke twijfel."}, {"role": "Jurylid 9", "text": "Het is elf tegen één. Akte 6 SLOTAKKOORD"}]}, {"title": "SCENE 16 PROJECTIE LEVEN", "cards": [{"role": "Jurylid 3", "text": "Nou, hoe zit het dan met al het andere bewijs? Hoe zit het met al die spullen, het mes, de hele zaak?"}, {"role": "Jurylid 2", "text": "Je zei dat we al het andere bewijs konden negeren, andere bewijzen weggooien."}, {"role": "Jurylid 8", "text": "(tegen de 3e jurylid) Je bent alleen."}, {"role": "Jurylid 3", "text": "Het maakt me niet uit of ik alleen ben of niet. Het is mijn recht."}, {"role": "Jurylid 8", "text": "Het is je recht."}, {"role": "Jurylid 3", "text": "Nou, wat wil je dan? Ik zeg dat hij schuldig is."}, {"role": "Jurylid 8", "text": "We willen je argumenten horen."}, {"role": "Jurylid 3", "text": "Ik heb je mijn argumenten gegeven."}, {"role": "Jurylid 8", "text": "We zijn niet overtuigd. We willen ze nog eens horen. We hebben alle tijd die nodig is."}, {"role": "Jurylid 3", "text": "Alles , alles wat in die rechtszaal naar voren is gekomen, maar ik bedoel echt alles, wijst erop dat hij schuldig is. Denk je soms dat ik een idioot ben of zo? Jullie waardeloze stelletje…... Je kunt me niet intimideren. Ik heb recht op mijn mening. Ik kan hier een jaar lang in deze verdomde kamer blijven zitten. Zeg ook eens wat. (de anderen kijken zwijgend toe) Kijk nu gewoon eens naar de bewijzen. Die oude man die daar woonde en alles hoorde. Of neem dat mes, wat is daarmee, alleen maar omdat hij er ook een vond dat erop leek? En dan het mes dat door een gat in zijn zak viel. Die oude man zag hem. Daar op de trap. Wat maakt het uit hoeveel seconden het duurde? Wat maakt het uit? Je kunt niet bewijzen dat hij niet bij de deur is gekomen. Je kunt natuurlijk zo veel als je wilt door de kamer strompelen, maar je kunt het niet bewijzen. Ik zeg je dat alles wat er is gebeurd hier verdraaid en omgedraaid is. Dat gedoe met de bril, hoe weet je dat ze die niet op had? De vrouw heeft in de rechtbank getuigd. Nou, wat wil je dan? Wat wil je dan nog meer. (de anderen zwijgen) Deze hele zaak….. Dat hele gedoe over die jongen die schreeuwde? Hij zei: \"Ik ga je vermoorden.\" Dat zei hij. Tegen zijn eigen vader. Het maakt me niet uit wat voor soort man dat was. Het was zijn vader! Het godverdomme gewoon zijn vader. Die verdomde rotjoch. Ik ken ze. Hoe ze zijn. Wat ze je aandoen. Hoe ze je elke dag vermoorden met hun blik, hun afkeuring. Mijn god, zie je het dan niet? Waarom ben ik de enige die het ziet? Dit, dit alles….. is als een dolk in mijn hart…."}, {"role": "Jurylid 8", "text": "Het is niet jouw jongen. Hij is iemand anders zijn zoon."}, {"role": "Jurylid 4", "text": "Laat hem leven. Laat die jongen leven. (Er valt een lange stilte. 3e jurylid is in zichzelf gekeerd en begint zachtjes te huilen. )"}]}, {"title": "SCENE 17 LAATSTE STEMMING", "cards": [{"role": "Voorzitter", "text": "Laten we stemmen. Wie van mening is dat de verdacht niet schuldig is. Steek je hand op. (Iedereen steekt zijn hand op alleen 3e jurylid nog niet. Men kijkt naar hem en hij steekt langzaam zijn hand op.)"}, {"role": "Jurylid 3", "text": "Niet schuldig."}, {"role": "Voorzitter", "text": "(De voorzitter telt de stemmen en schrijft de uitslag op een briefje. Er wordt niets gezegd. Iedereen blijft zitten. De voorzitter staat op hij loopt naar de deur en klopt erop. De bewaker komt binnen.) We zijn klaar. Er is een unaniem besluit genomen. (De bewaker opent de deur een iedereen staat op en pakt zijn spullen. Iedereen loopt af. Het licht dimt. Op de schermen of geluidsfragment.)"}]}, {"title": "SCENE 18 EINDOORDEEL GELUIDSFRAGMENT", "cards": [{"role": "Stem Rechter", "text": "Leden van de jury, in de zaak tegen de verdachte, Miguel Garcia, die terechtstaat wegens moord in de eerste graad, gepleegd met voorbedachten rade, is het moment gekomen om uw oordeel te vellen. Ik vraag u daarom: acht u de verdachte, Miguel Garcia, schuldig aan moord in de eerste graad met voorbedachten rade? Is UW oordeel unaniem?"}, {"role": "Voorzitter", "text": "Dat is het, Edelachtbare. (Nog een ademloze seconde.) Wij bevinden de verdachte… niet schuldig."}]}]};
let si=0,pos=0,practicing=false,revealed=false;
const $=x=>document.getElementById(x);
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function cs(){return D.scenes[si]?.cards||[]}
function isMine(c){return c.role===$('role').value}
D.roles.forEach(r=>$('role').add(new Option(r,r)));
D.scenes.forEach((s,i)=>$('scene').add(new Option(s.title,i)));
let def=D.roles.indexOf("Jurylid 8"); $('role').selectedIndex=def>=0?def:0;

function readScene(){
 practicing=false; revealed=false;
 $('out').innerHTML=cs().map(c=>`<article class="card ${isMine(c)?'mine':''}">
 <b>${esc(c.role)}</b><div>${esc(c.text)}</div></article>`).join('');
 $('bar').style.width='0%'; $('status').textContent=$('scene').selectedOptions[0]?.text||'';
}
function start(){
 let i=cs().findIndex(isMine);
 if(i<0){$('out').innerHTML='<article class="card">Deze rol heeft geen repliek in deze scène.</article>';return}
 practicing=true; pos=i; revealed=false; render();
}
function render(){
 let a=cs(); if(!a[pos])return;
 // ALLE voorafgaande gesproken replieken, ongeacht wie ze zegt.
 let h='';
 for(let i=0;i<pos;i++) {
   let c=a[i];
   h+=`<article class="card cue"><b>${esc(c.role)}</b><div>${esc(c.text)}</div></article>`;
 }
 let c=a[pos];
 h+=`<article class="card mine"><b>${esc(c.role)} — MIJN TEKST</b>
 <div class="${revealed?'':'blur'}">${esc(c.text)}</div>
 <small>${revealed?'':'Zeg je repliek uit het hoofd en toon daarna de tekst ter controle.'}</small></article>`;
 $('out').innerHTML=h;
 $('bar').style.width=((pos+1)/a.length*100)+'%';
}
function next(){
 if(!practicing)return; let a=cs(),i=pos+1;
 while(i<a.length&&!isMine(a[i]))i++;
 if(i<a.length){pos=i;revealed=false;render()}else $('status').textContent='Alle replieken van jouw rol in deze scène zijn geoefend.';
}
function prev(){
 if(!practicing)return; let a=cs(),i=pos-1;
 while(i>=0&&!isMine(a[i]))i--;
 if(i>=0){pos=i;revealed=false;render()}
}
$('read').onclick=readScene;$('start').onclick=start;$('next').onclick=next;$('prev').onclick=prev;
$('reveal').onclick=()=>{if(practicing){revealed=true;render()}};
$('role').onchange=()=>practicing?start():readScene();
$('scene').onchange=()=>{si=+$('scene').value;readScene()};
readScene();
</script>
<script id="speech-practice-script">
/* Spraakoefening: gebruikt de ingebouwde Web Speech API van de browser. */
(function () {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let finalTranscript = '';

  const style = document.createElement('style');
  style.textContent = '.speech-panel{margin:10px 0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc}.speech-panel p{margin:6px 0}.speech-panel .speech-live{min-height:1.4em;color:#334155}.speech-panel .speech-score{font-weight:700}.speech-panel.unsupported{background:#fff7ed;border-color:#fed7aa}';
  document.head.appendChild(style);

  const toolbar = $('read').parentElement;
  const listenButton = document.createElement('button');
  listenButton.id = 'listen';
  listenButton.type = 'button';
  listenButton.textContent = '🎙️ Start spraakoefening';
  listenButton.disabled = !SpeechRecognition;
  toolbar.insertBefore(listenButton, $('reveal'));

  const panel = document.createElement('section');
  panel.id = 'speech-panel';
  panel.className = 'speech-panel' + (SpeechRecognition ? '' : ' unsupported');
  panel.innerHTML = SpeechRecognition
    ? '<strong>Spraakoefening</strong><p id="speech-help">Start de oefening, zeg je verborgen repliek en vergelijk daarna de tekst.</p><p class="speech-live" id="speech-live" aria-live="polite"></p><p class="speech-score" id="speech-score"></p>'
    : '<strong>Spraakoefening niet beschikbaar</strong><p>Deze browser ondersteunt geen spraakherkenning. Open de app in een recente versie van Chrome of Edge.</p>';
  $('out').before(panel);

  const live = () => $('speech-live');
  const score = () => $('speech-score');
  const help = () => $('speech-help');
  const normalise = text => text
    .replace(/\([^)]*\)/g, ' ')
    .toLocaleLowerCase('nl-NL')
    .replace(/[^\p{L}\p{N}'’\s]/gu, ' ')
    .replace(/\s+/g, ' ').trim();
  const words = text => normalise(text).split(' ').filter(Boolean);
  const lcsLength = (expected, spoken) => {
    let previous = new Uint16Array(spoken.length + 1);
    for (const expectedWord of expected) {
      const current = new Uint16Array(spoken.length + 1);
      for (let column = 1; column <= spoken.length; column++) {
        current[column] = expectedWord === spoken[column - 1]
          ? previous[column - 1] + 1
          : Math.max(previous[column], current[column - 1]);
      }
      previous = current;
    }
    return previous[spoken.length];
  };
  const updateScore = () => {
    if (!practicing || !cs()[pos]) return;
    const expected = words(cs()[pos].text);
    const spoken = words(finalTranscript);
    if (!spoken.length) { score().textContent = ''; return; }
    const percentage = expected.length ? Math.round((lcsLength(expected, spoken) / expected.length) * 100) : 0;
    score().textContent = `Overeenkomst met je repliek: ${percentage}%. ${percentage >= 85 ? 'Goed gedaan — controleer eventueel je tekst en ga verder.' : 'Blijf oefenen; toon je tekst om te vergelijken.'}`;
  };
  const resetFeedback = () => {
    finalTranscript = '';
    if (live()) live().textContent = '';
    if (score()) score().textContent = '';
    if (help()) help().textContent = 'Zeg je verborgen repliek. De herkenning vergelijkt alleen gesproken woorden; regieaanwijzingen tellen niet mee.';
  };
  const stopListening = () => {
    if (recognition && listening) recognition.stop();
    listening = false;
    if (SpeechRecognition) listenButton.textContent = '🎙️ Start spraakoefening';
  };
  const startListening = () => {
    if (!practicing) { $('status').textContent = 'Kies eerst “Start oefenen” om een repliek te oefenen.'; return; }
    resetFeedback();
    recognition = new SpeechRecognition();
    recognition.lang = 'nl-NL';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = event => {
      let interim = '';
      for (let index = event.resultIndex; index < event.results.length; index++) {
        const text = event.results[index][0].transcript;
        if (event.results[index].isFinal) finalTranscript += `${text} `;
        else interim += text;
      }
      live().textContent = `Herkenning: ${(finalTranscript + interim).trim()}`;
      updateScore();
    };
    recognition.onerror = event => {
      const messages = { 'not-allowed': 'Microfoontoegang is niet toegestaan. Sta deze toe in de browser en probeer opnieuw.', 'no-speech': 'Geen spraak gehoord. Probeer het opnieuw.', 'network': 'Spraakherkenning heeft een netwerkverbinding nodig.' };
      help().textContent = messages[event.error] || `Spraakherkenning kon niet starten (${event.error}).`;
    };
    recognition.onend = () => { listening = false; listenButton.textContent = '🎙️ Start spraakoefening'; updateScore(); };
    try {
      recognition.start();
      listening = true;
      listenButton.textContent = '■ Stop spraakoefening';
      help().textContent = 'Luisteren… zeg je repliek hardop. Klik op stop wanneer je klaar bent.';
    } catch (_) { help().textContent = 'De microfoon start al. Klik op stop en probeer opnieuw.'; }
  };
  listenButton.onclick = () => listening ? stopListening() : startListening();

  const originalRender = render;
  render = function () { stopListening(); originalRender(); resetFeedback(); };
  const originalReadScene = readScene;
  readScene = function () { stopListening(); originalReadScene(); resetFeedback(); };
})();
</script>
<script id="v5-script">
(function(){
 function init(){
  if(document.getElementById('v5-panel')) return;
  const host=document.querySelector('main')||document.body;
  const p=document.createElement('section'); p.id='v5-panel'; p.className='v5-panel';
  p.innerHTML='<div class="v5-title">Versie 5 · Oefeninstellingen</div>'+
   '<div class="v5-buttons">'+
   '<button class="v5-button selected" data-mode="all">Alle cues</button>'+
   '<button class="v5-button" data-mode="3">Laatste 3</button>'+
   '<button class="v5-button" data-mode="1">Laatste cue</button>'+
   '<button class="v5-button" data-mode="scene">Hele scène</button>'+
   '<button class="v5-button" id="v5-directions">Regieaanwijzingen: aan</button></div>'+
   '<div class="v5-help">Kies hoeveel voorafgaande replieken je wilt zien. Regieaanwijzingen die als losse haakjesregel zijn herkend, worden apart opgemaakt.</div>';
  host.insertBefore(p,host.firstChild);
  let mode='all', showDirections=true;
  p.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
   mode=b.dataset.mode;p.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b));
   window.dispatchEvent(new CustomEvent('v5-cue-mode',{detail:mode}));
   applyCueMode();
  });
  p.querySelector('#v5-directions').onclick=()=>{
   showDirections=!showDirections;
   p.querySelector('#v5-directions').textContent='Regieaanwijzingen: '+(showDirections?'aan':'uit');
   document.querySelectorAll('.v5-direction').forEach(x=>x.style.display=showDirections?'':'none');
  };
  function applyCueMode(){
   const cards=[...document.querySelectorAll('.line-card,.dialogue-card,.repliek,.line')];
   if(!cards.length)return;
   const idx=cards.findIndex(el=>el.querySelector('.hidden,.blurred,[data-hidden="true"]'));
   if(idx<0)return;
   cards.forEach((el,i)=>{
    if(i>=idx){el.style.display='';return;}
    const n=idx-i;
    el.style.display=(mode==='all'||mode==='scene'||(mode==='3'&&n<=3)||(mode==='1'&&n<=1))?'':'none';
   });
  }
  function markDirections(){
   document.querySelectorAll('p,div,span,li').forEach(el=>{
    if(el.children.length)return;
    const t=(el.textContent||'').trim();
    if(/^\([^()]{2,220}\)$/.test(t))el.classList.add('v5-direction');
   });
  }
  new MutationObserver(()=>{markDirections();applyCueMode()}).observe(document.body,{childList:true,subtree:true});
  markDirections();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
